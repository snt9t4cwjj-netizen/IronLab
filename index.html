<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iron Lab</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--tx:#14202b;--mu:#62707d;--ac:#1f5fbf;--hi:#f2b705;--ln:#d8dee3;--ok:#1e8e4e;--bad:#d0342c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18232e;--tx:#e8eef3;--mu:#8fa0ae;--ac:#5b9bff;--ln:#2a3947;--ok:#4cc27f;--bad:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18232e;--tx:#e8eef3;--mu:#8fa0ae;--ac:#5b9bff;--ln:#2a3947;--ok:#4cc27f;--bad:#ff7a70;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:680px;margin:0 auto;padding:10px 10px 90px}
.shell{display:flex;gap:10px;align-items:flex-start}
main{flex:1;min-width:0}
.rail{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:6px;width:62px;flex:none}
.rail button{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:10px 0 7px;font-size:11px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px}
.rail button b{font-size:20px;font-weight:400}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card.open{grid-column:1/-1}
.bub{padding:8px 12px;border-radius:14px;margin:6px 0;max-width:88%;font-size:15px}
.bub.u{background:var(--ac);color:var(--on,#fff);margin-left:auto}
.bub.a{background:var(--bg);border:1px solid var(--ln)}
.demo{max-width:190px;margin:8px auto;color:var(--tx)}
.demo svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{background:#101a24;color:#f2f5f7;border-radius:10px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:24px;font-weight:800;color:var(--hi)}
.stats small{color:#9fb0bd}
#app[data-t=today] h1{font-size:30px;font-style:italic;font-weight:900}
#app[data-t=today] .card{border-left:7px solid var(--ac)}
#app[data-t=lib]{--ac:#c98a1b;--on:#1b1300;font-family:Georgia,"Times New Roman",serif}
#app[data-t=lib] .card{margin:0;border:1px dashed var(--mu);border-top:9px solid var(--ac);border-radius:4px}
#app[data-t=cal]{--ac:#d0463b}
#app[data-t=cal] .cal{background:var(--card);border:2px solid var(--ac);border-radius:8px;padding:8px}
#app[data-t=cal] .day{border:0;border-radius:50%;background:transparent;color:var(--tx)}
#app[data-t=cal] .day.on{background:var(--ac)!important;color:#fff!important}
#app[data-t=cal] .day.td{box-shadow:0 0 0 2px var(--hi)}
#app[data-t=meals]{--ac:#2e9e5b;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#app[data-t=meals] .card{border:0;border-radius:0;border-bottom:3px dashed var(--ac)}
#app[data-t=rev]{--ac:#7c5cd6}
#app[data-t=ideas]{--ac:#0e9aa7}
#app[data-t=ideas] .card{border:1px dashed var(--ac);border-top:6px solid var(--ac);border-radius:6px}
#app[data-t=rev] .tip{background:#101a24;color:#f2f5f7;border-left:6px solid var(--hi);padding:12px;border-radius:4px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;margin:18px 0 8px}
small,.mu{color:var(--mu);font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi)}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
nav button,.chip{border:1px solid var(--ln);background:var(--card);padding:8px 14px;border-radius:20px;white-space:nowrap}
.on{background:var(--ac)!important;color:var(--on,#fff)!important;border-color:var(--ac)!important}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{display:flex;gap:6px;flex-wrap:wrap}
.set{display:grid;grid-template-columns:16px 32px 1fr 32px 1fr 48px;gap:4px;align-items:center;margin:7px 0}
.set input,.g input{width:100%;padding:9px 4px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);text-align:center}
.set button{padding:9px 0;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.set.ok .chk{background:var(--ok);color:#fff;border-color:var(--ok)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border:1px solid var(--ln);background:var(--card);border-radius:8px}
.day.td{border-color:var(--hi);border-width:2px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pri{background:var(--ac);color:var(--on,#fff);border:0;padding:11px 16px;border-radius:10px;font-weight:700}
.tip{border-left:4px solid var(--hi);padding-left:10px;margin:10px 0}
#rt{position:fixed;left:0;right:0;bottom:0;text-align:center;background:var(--ac);color:#fff;font-weight:700;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px))}
#rt:empty{display:none}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-120px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;transition:transform .25s;z-index:9}
#toast.show{transform:translate(-50%,0)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*{-webkit-tap-highlight-color:transparent}
button,label,select{touch-action:manipulation}
input,select,textarea{font-size:16px}
button{transition:transform .08s ease,background-color .15s ease}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{-webkit-appearance:none;appearance:none;padding-right:30px!important;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%)!important;background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%!important;background-size:5px 5px!important;background-repeat:no-repeat!important}
.card{box-shadow:0 1px 2px rgba(0,0,0,.06);overflow-wrap:anywhere}
.rail button{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.rail .on{box-shadow:0 2px 8px rgba(0,0,0,.22)}
h2{margin:22px 0 8px}
.bar{height:10px;border-radius:5px}
.set input{font-size:17px;font-weight:600}
@media (min-width:600px){#app{padding-top:20px}.rail{width:76px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
#app{padding-bottom:120px}
.shell{display:block}
.rail{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:680px;margin:0 auto;z-index:10;display:flex;flex-direction:row;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln);box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.rail button{flex:1;min-width:0;border:0;background:transparent;border-radius:12px;padding:12px 2px;font-size:13px;font-weight:600;line-height:1.1;display:block;box-shadow:none;color:var(--mu)}
.rail .on{box-shadow:none}
#rt{bottom:calc(62px + env(safe-area-inset-bottom,0px));padding:10px 8px;max-width:680px;margin:0 auto}
</style></head>
<body><div id="app"></div><div id="rt"></div><div id="toast"></div>
<script>
const EX={bench:['Barbell Bench Press','Chest','Compound'],ohp:['Overhead Press','Shoulders','Compound'],row:['Barbell Row','Back','Compound'],squat:['Back Squat','Quads','Compound'],rdl:['Romanian Deadlift','Hamstrings','Compound'],dl:['Deadlift','Posterior chain','Compound'],
dbinc:['Incline DB Press','Chest','Dumbbell'],dbsh:['DB Shoulder Press','Shoulders','Dumbbell'],dbsplit:['DB Bulgarian Split Squat','Legs','Dumbbell'],dbhip:['DB Hip Thrust','Glutes','Dumbbell'],dbcurl:['DB Curl','Biceps','Dumbbell'],dbcalf:['DB Calf Raise','Calves','Dumbbell'],dblat:['DB Lateral Raise','Shoulders','Dumbbell'],dbrow:['One-Arm DB Row','Back','Dumbbell'],
cabrow:['Seated Cable Row','Back','Cable'],cabpd:['Lat Pulldown','Back','Cable'],cabfly:['Cable Fly','Chest','Cable'],cabtri:['Triceps Pushdown','Triceps','Cable'],cabface:['Face Pull','Rear delts','Cable'],cabcurl:['Cable Curl','Biceps','Cable'],cabcr:['Cable Crunch','Abs','Cable'],cabpt:['Cable Pull-Through','Glutes','Cable']};
const PLAN=[{n:'Upper A',l:[['bench',4,'6–8'],['cabrow',3,'10'],['dbsh',3,'8–10'],['cabpd',3,'10'],['cabtri',3,'12'],['dbcurl',3,'12']]},
{n:'Lower A',l:[['squat',4,'6–8'],['rdl',3,'8'],['dbsplit',3,'10'],['cabpt',3,'12'],['dbcalf',4,'12'],['cabcr',3,'12']]},
{n:'Upper B',l:[['ohp',4,'6–8'],['row',4,'8'],['dbinc',3,'10'],['cabfly',3,'12'],['cabface',3,'15'],['cabcurl',3,'12']]},
{n:'Lower B',l:[['dl',3,'5'],['dbhip',3,'10'],['dbsplit',3,'10'],['cabpt',3,'12'],['dbcalf',4,'12'],['cabcr',3,'12']]}];
// name, kcal, protein, carbs, fat, est. $/serving, ingredients (aisle|item)
const R={b:[['Peanut butter protein oats',680,42,85,20,2.1,'S|Rolled oats,S|Protein powder,P|Bananas,S|Peanut butter,D|Milk'],['Egg & cheese breakfast burritos',650,38,56,28,2.6,'M|Eggs,S|Flour tortillas,D|Shredded cheese,S|Black beans,S|Salsa'],['Greek yogurt crunch bowl',620,45,78,14,2.9,'D|Greek yogurt,S|Granola,P|Berries,S|Honey'],['Sausage & potato scramble',700,45,60,30,2.7,'M|Eggs,M|Turkey sausage,P|Potatoes,D|Shredded cheese']],
l:[['Chicken burrito bowl',820,55,95,22,3.4,'M|Chicken thighs,S|Rice,S|Black beans,S|Corn,S|Salsa,D|Shredded cheese'],['Turkey spinach pasta',780,52,92,20,3.1,'M|Ground turkey,S|Pasta,P|Spinach,S|Marinara,D|Parmesan'],['Tuna rice & egg bowl',760,56,85,18,2.8,'S|Canned tuna,S|Rice,M|Eggs,F|Frozen peas,S|Soy sauce'],['Chicken fried rice',800,50,100,20,3.0,'M|Chicken breast,S|Rice,M|Eggs,F|Frozen veggie mix,S|Soy sauce']],
d:[['Beef taco skillet',880,50,82,38,3.9,'M|Ground beef,S|Rice,S|Black beans,S|Taco seasoning,D|Shredded cheese,S|Salsa'],['Sheet-pan sausage & potatoes',820,48,70,38,3.3,'M|Chicken sausage,P|Potatoes,P|Broccoli,S|Olive oil'],['Creamy Tuscan chicken pasta',900,58,95,32,4.0,'M|Chicken breast,S|Pasta,P|Spinach,D|Heavy cream,D|Parmesan,P|Tomatoes'],['Beef & broccoli rice bowl',850,52,90,30,3.8,'M|Flank steak,P|Broccoli,S|Rice,S|Soy sauce,S|Brown sugar']],
s:[['Cottage cheese & fruit',250,25,25,5,1.4,'D|Cottage cheese,P|Berries'],['Protein shake & banana',330,32,40,5,1.5,'S|Protein powder,D|Milk,P|Bananas'],['PB & banana sandwich',400,15,52,16,0.9,'S|Bread,S|Peanut butter,P|Bananas'],['Trail mix & string cheese',380,14,28,24,1.3,'S|Trail mix,D|String cheese']]};
R.b.push(['Cottage cheese oat pancakes',480,38,52,12,1.8,'M|Eggs,S|Rolled oats,D|Cottage cheese,P|Bananas']);
R.l.push(['Smash-burger rice bowl',820,48,75,36,3.2,'M|Ground beef,S|Rice,D|Shredded cheese,P|Lettuce,P|Tomatoes,S|Pickles']);
R.d.push(['Sausage & pepper pasta skillet',870,54,92,28,3.1,'M|Chicken sausage,P|Bell peppers,P|Onion,S|Marinara,S|Pasta,D|Mozzarella']);
R.s.push(['Turkey & cheese quesadilla',520,38,42,22,2.0,'M|Deli turkey,S|Flour tortillas,D|Shredded cheese,P|Spinach,S|Salsa']);
const HW={b:['Microwave oats with milk for 2 minutes, stir in protein powder and peanut butter, top with sliced banana.','Scramble eggs, fill tortillas with eggs, cheese, beans and salsa, roll up and toast. Freezes well.','Layer yogurt, granola and berries, then drizzle with honey.','Brown sausage and diced potatoes, add eggs and scramble, top with cheese.','Blend oats, cottage cheese, eggs and banana. Cook like pancakes, about 2 minutes per side.'],
l:['Cook rice. Sear seasoned chicken thighs and slice. Bowl with beans, corn, salsa and cheese.','Brown turkey, add spinach and marinara, toss with cooked pasta and top with parmesan.','Cook rice and fry eggs. Top with tuna and warmed peas, then add soy sauce.','Stir-fry chicken, add veggies and cold rice, push aside and scramble eggs, finish with soy sauce.','Smash beef into thin patties, cook 2 minutes per side with cheese, then chop over rice with lettuce, tomato and pickles.'],
d:['Brown beef with taco seasoning, add beans and cooked rice, top with cheese and salsa.','Toss sausage, potatoes and broccoli in oil and roast at 425\u00b0F for 25 to 30 minutes.','Sear chicken, add spinach, tomatoes and cream and simmer, then toss with pasta and parmesan.','Sear sliced steak, add broccoli and a soy and brown sugar sauce, serve over rice.','Brown sausage with peppers and onion, add marinara and pasta, top with mozzarella until melted.'],
s:['Scoop cottage cheese and top with berries.','Shake protein powder with milk and eat with a banana.','Spread peanut butter on bread and add sliced banana.','Mix trail mix and pair with string cheese.','Layer turkey, cheese and spinach in a tortilla, toast until crisp, serve with salsa.']};
const AI={P:'Produce',M:'Meat & eggs',D:'Dairy',S:'Pantry',F:'Frozen'};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dt=s=>new Date(s+'T12:00:00');
const today=iso(new Date());
const wk=s=>{const d=dt(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
let S=null;try{S=JSON.parse(localStorage.getItem('ironlog1'))}catch(e){}
S=Object.assign({logs:{},ci:[],mood:{},xp:0,prs:0,bw:[{d:today,w:175}],g:{k:2650,p:160,c:345,f:70},meals:null,eat:{},wk:{},got:{},foods:[],adj:{},chat:{},cm:{},custom:{}},S||{});
const save=()=>{try{localStorage.setItem('ironlog1',JSON.stringify(S))}catch(e){}};
if(!S.plan||!S.plan.length)S.plan=JSON.parse(JSON.stringify(PLAN));
let tab='today',pd=null,calM=new Date(),lf='All',rt=0,ti;
const $=id=>document.getElementById(id);
const tw=a=>Math.max(...a.map(s=>s.w));
const hist=(id,b)=>Object.keys(S.logs).filter(d=>d<b&&S.logs[d].ex[id]&&S.logs[d].ex[id].length).sort().map(d=>S.logs[d].ex[id]);
const toast=m=>{const e=$('toast');e.textContent=m;e.className='show';setTimeout(()=>e.className='',2600)};
function rest(n){clearInterval(ti);rt=n;ti=setInterval(()=>{rt--;$('rt').textContent=rt>0?'Rest '+Math.floor(rt/60)+':'+String(rt%60).padStart(2,'0'):'Go lift';if(rt<=-4){clearInterval(ti);$('rt').textContent=''}},1000);$('rt').textContent='Rest'}
function streak(){let n=0,d=dt(wk(today));const c=w=>S.ci.filter(x=>wk(x)==w).length;if(c(iso(d))<3)d.setDate(d.getDate()-7);while(c(iso(d))>=3){n++;d.setDate(d.getDate()-7)}return n}
function checkin(){if(!S.ci.includes(today)){S.ci.push(today);S.xp+=25;save();toast('Gym check-in logged +25 XP')}}
function head(){const lv=Math.floor(S.xp/250)+1;return `<div class=row><h1>${TT[tab]}</h1>${tab=='today'?`<button class="chip${S.ci.includes(today)?' on':''}" onclick="checkin();render()">${S.ci.includes(today)?'Checked in ✓':'Check in'}</button>`:`<small>Lv ${lv}</small>`}</div><div class=bar><i style="width:${S.xp%250/2.5}%"></i></div><small>${tab=='today'?'Lv '+lv+' · ':''}${S.xp} XP · ${streak()}-week streak · ${S.prs} PRs</small>`}
let pe=false,rarm=false;
const LOWER=['squat','rdl','dl'];
function sugg(id,rp){const H=hist(id,today);if(!H.length)return null;const last=H[H.length-1],w=tw(last),at=last.filter(s=>s.w==w),n=(String(rp).match(/\d+/g)||['8']).map(Number),lo=n[0],hi=n[n.length-1],inc=LOWER.includes(id)?10:5,avg=at.reduce((a,s)=>a+s.r,0)/at.length,st=H.length>2&&tw(H[H.length-2])==w&&tw(H[H.length-3])==w;
if(at.length>=2&&at.every(s=>s.r>=hi))return{dir:'up',w:w+inc,msg:`You hit ${hi}+ reps on every set at ${w} lb last time. Add ${inc} lb and aim for ${lo}+ reps.`};
if(avg<lo)return{dir:'down',w:Math.max(0,Math.round((w-inc)/2.5)*2.5),msg:`Reps averaged ${avg.toFixed(1)}, under your ${lo}-rep target. Drop ${inc} lb and rebuild.`};
return{dir:'hold',w,msg:st?'Same weight for 3 sessions. Add a rep on each set, or drop 10% and rebuild.':`Stay at ${w} lb and add a rep on each set until all reach ${hi}.`}}
function plName(i,v){S.plan[i].n=v.trim()||'Day '+(i+1);save()}
function plSet(i,j,k,v){const l=S.plan[i].l;if(k==0){if(l.some((x,y)=>y!=j&&x[0]==v)){toast('That lift is already in this day');return render()}l[j][0]=v}else if(k==1)l[j][1]=Math.max(1,Math.round(+v)||1);else l[j][2]=v.trim()||'10';save()}
function plMove(i,j,d){const l=S.plan[i].l,t=j+d;if(t<0||t>=l.length)return;[l[j],l[t]]=[l[t],l[j]];save();render()}
function plDel(i,j){S.plan[i].l.splice(j,1);save();render()}
function plAdd(i){const id=$('add-'+i).value;if(S.plan[i].l.some(x=>x[0]==id))return toast('That lift is already in this day');S.plan[i].l.push([id,3,'10']);save();render()}
function dayAdd(){S.plan.push({n:'Day '+(S.plan.length+1),l:[]});save();render()}
function dayDel(i){if(S.plan.length<2)return toast('Keep at least one day');S.plan.splice(i,1);pd=0;save();render()}
function planReset(){if(!rarm){rarm=true;setTimeout(()=>rarm=false,6000);return toast('Tap again to reset the plan')}rarm=false;S.plan=JSON.parse(JSON.stringify(PLAN));pd=0;save();render()}
function planV(){const opt=sel=>Object.entries(EX).map(([id,e])=>`<option value="${id}"${id==sel?' selected':''}>${e[0]}</option>`).join(''),sm='padding:9px 4px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);text-align:center';
let h=`<div class=row><b>Edit plan</b><button class=pri onclick="pe=false;render()">Done</button></div><p class=mu>Changes save automatically and your past logs are kept.</p>`;
S.plan.forEach((d,i)=>{h+=`<div class=card><div class=row><input value="${esc(d.n)}" onchange="plName(${i},this.value)" style="${IS};font-weight:700"><button class=chip onclick="dayDel(${i})" style="margin-left:6px;white-space:nowrap">Delete day</button></div>`+d.l.map((x,j)=>`<div style="margin-top:12px"><select onchange="plSet(${i},${j},0,this.value)" style="${IS}">${opt(x[0])}</select><div class=row style="margin-top:6px"><span class=wrap style="flex-wrap:nowrap;align-items:center"><input type=number inputmode=numeric value="${x[1]}" onchange="plSet(${i},${j},1,this.value)" style="width:52px;${sm}"><small>sets ×</small><input value="${esc(x[2])}" onchange="plSet(${i},${j},2,this.value)" style="width:68px;${sm}"><small>reps</small></span><span class=wrap style="flex-wrap:nowrap"><button class=chip onclick="plMove(${i},${j},-1)">↑</button><button class=chip onclick="plMove(${i},${j},1)">↓</button><button class=chip onclick="plDel(${i},${j})">✕</button></span></div></div>`).join('')+`<div class=row style="margin-top:14px"><select id=add-${i} style="${IS}">${opt('')}</select><button class=pri onclick="plAdd(${i})" style="margin-left:6px">Add</button></div></div>`});
return h+`<p class=wrap><button class=chip onclick="dayAdd()">Add a day</button><button class=chip onclick="planReset()">Reset to default plan</button></p>`}
